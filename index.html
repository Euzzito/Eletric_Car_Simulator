<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./src/css/estilo.css">
    <title>Eletric Car Simulator</title>
</head>
<body>

    <header>
        <h1 id="logo"><span>Eletric</span> Car Simulator</h1>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Sobre</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main id="container">
        <div class="name">
            <h2>Simulador</h2>
        </div>
        <section class="cards">
            <div class="card">
                <article class="card-content">
                    <div>
                        <h2>Carro 1</h2>
                        <h4>Consumo (kWh):</h4>
                        <div class="input">
                            <input class="button" type="number" min="0" placeholder="kWh" id="carro1">
                        </div>
                    </div>
                    <div>
                        <h2>Carro 2</h2>
                        <h4>Consumo (kWh):</h4>
                        <div class="input">
                            <input class="button" type="number" min="0" placeholder="kWh" id="carro2">
                        </div>
                    </div>
                    <div>
                        <h2>Simulação</h2>
                        <h4>Distancia (km):</h4>
                        <div class="input">
                            <input class="button" type="number" min="0" placeholder="km" id="distancia">
                        </div>
                        <h4>Preço Energia (R$/kWh):</h4>
                        <div class="input">
                            <input class="button" type="number" min="0" placeholder="R$/kWh" id="preco">
                        </div>
                    </div>
                    <div>
                        <button onclick="" class="button2">Calcular</button>
                    </div>
                    
                </article>

            </div>

        </section>
        <div class="name">
            <h2>Resultados</h2>
        </div>
        <section class="cards">
            <div class="card">
                <article class="card-content2">
                    <div>

                    </div>

                </article>

            </div>

        </section>

    </main>
    <footer>
        <p>&copy; 2026 Direitos Reservados</p>
    </footer>
    
</body>
</html>
